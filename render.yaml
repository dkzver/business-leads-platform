services:
  - type: web
    name: business-leads-platform
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: business-leads-db
          property: connectionString

databases:
  - name: business-leads-db
    plan: free
    region: frankfurt
    databaseName: business_leads
    user: business_leads_user
